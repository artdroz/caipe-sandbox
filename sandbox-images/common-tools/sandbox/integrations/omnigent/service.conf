[program:omnigent]
command=/opt/venv/bin/python /usr/local/lib/sandbox/integrations/omnigent/main.py
autostart=true
autorestart=true
startsecs=2
startretries=5
stopwaitsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_SANDBOX_STATE)s/logs/omnigent.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
