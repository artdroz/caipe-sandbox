[build-system]
requires = ["setuptools>=84.1.0,<85", "wheel>=0.48,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1", "starlette>=1.3.1,<2", "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28.1,<1", "kubernetes>=32.0.1,<33",
  "Authlib>=1.9.1,<2", "itsdangerous>=2.2,<3",
  "pydantic>=2.9,<3", "joserfc>=1.7.7,<2", "websocket-client>=1.9,<2",
  "certifi>=2026.10.19",
  "oauthlib>=4,<5",
  "openshell>=0.1.6,<0.1.7",
  "msgpack>=1.2.3,<2",
  "opentelemetry-sdk>=1.45.1,<2", "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
  "SQLAlchemy>=2.0.43,<3", "alembic>=1.16.5,<2", "psycopg[binary]>=3.2.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "supervisor>=4.3,<5", "websockets>=17.1,<18"]

[dependency-groups]
build = ["pip>=26.2.1,<27", "setuptools>=84.1.0,<85", "wheel>=0.48,<0.49"]
security = ["pip-audit>=2.10.1,<3", "filelock>=4.2.1,<5"]

[tool.uv]
required-version = ">=0.12.17"
exclude-newer = "30 days"
default-groups = []
constraint-dependencies = ["pyasn1>=0.6.5", "opentelemetry-api>=1.45.1"]

[tool.uv.exclude-newer-package]
# Remove after 2026-11-06, when the upstream tracestate parsing fix is over 30 days old.
opentelemetry-api = "2026-10-07T00:00:00Z"
opentelemetry-sdk = "2026-10-07T00:00:00Z"
opentelemetry-exporter-otlp-proto-http = "2026-10-07T00:00:00Z"
opentelemetry-exporter-otlp-proto-common = "2026-10-07T00:00:00Z"
opentelemetry-proto = "2026-10-07T00:00:00Z"
opentelemetry-semantic-conventions = "2026-10-07T00:00:00Z"
opentelemetry-exporter-otlp-common = "2026-10-07T00:00:00Z"
opentelemetry-exporter-http-transport = "2026-10-07T00:00:00Z"
# Remove after 2026-11-14, when the verified OAuth/JOSE fixes have aged 30 days.
authlib = "2026-10-15T00:00:00Z"
# Remove after 2026-11-18, when the verified JOSE security fixes have aged 30 days.
joserfc = "2026-10-20T00:00:00Z"
# Remove after 2026-11-26, when the ASN.1 decoder security fixes have aged 30 days.
pyasn1 = "2026-10-28T00:00:00Z"
# Remove after 2026-10-30, when the verified parser memory-safety fix has aged 30 days.
msgpack = "2026-09-30T00:00:00Z"
# Approved gateway/SDK compatibility exception; remove after 2026-11-27.
openshell = "2026-10-29T00:00:00Z"
# Remove after 2026-11-19, when the verified certificate-bundle fix has aged 30 days.
certifi = "2026-10-21T00:00:00Z"
# Remove after 2026-10-28, when the verified PKCE fix has aged 30 days.
oauthlib = "2026-09-29T00:00:00Z"
# Remove after 2026-11-16, when the verified file-lock security fixes have aged 30 days.
filelock = "2026-10-18T00:00:00Z"
# Remove after 2026-11-18, when the verified wheel-installation fix has aged 30 days.
setuptools = "2026-10-19T20:12:00Z"

[tool.setuptools.package-data]
portal = ["static/*", "storage/migrations/*.py", "storage/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../../sandbox-images/common-tools"]

[tool.setuptools.packages.find]
include = ["portal*"]
