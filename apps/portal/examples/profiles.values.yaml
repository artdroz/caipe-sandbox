settings:
  runtimeClass: kata-qemu  # Replace with an installed, approved class.
# Set approved images and consumer URLs before deployment.
namespace:
  strategy: perSandbox
  labels:
    platform.example.com/purpose: agent-sandbox
  annotations:
    platform.example.com/contact: platform-team
defaultProfile: engineering
profiles:
- id: engineering
  title: Engineering terminal
  description: A persistent workspace with profile-defined tools and helpers.
  agentSandbox:
    spec:
      podTemplate:
        spec:
          containers:
          - name: host
            image: python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
            command:
            - sleep
            - infinity
            workingDir: /home/sandbox
            env:
            - name: HOME
              value: /home/sandbox
            volumeMounts:
            - name: home
              mountPath: /home/sandbox
  terminal:
    command:
    - /bin/sh
    - -i
  helpers:
  - id: workspace
    title: Open workspace
    icon: folder
    script: |
      cd "$HOME"
      exec /bin/sh -i
  - id: disk-usage
    title: Workspace disk usage
    icon: disk
    script: |
      du -sh "$HOME"
  ui:
    resources:
      default:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 20Gi
      minimum:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 100m
          memory: 256Mi
        storage: 1Gi
      maximum:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 50Gi
- id: claude-development
  title: Claude development
  description: Example CLI preset; use a workload image containing Claude Code.
  agentSandbox:
    spec:
      podTemplate:
        spec:
          containers:
          - name: host
            image: ghcr.io/omnigent-ai/omnigent-host@sha256:51880f0edb7e0357f395f88f4bc3c4e1dfc3df06e46cffb55ae6700c1dfd82b2
            command:
            - sleep
            - infinity
            workingDir: /home/omnigent
            env:
            - name: HOME
              value: /home/omnigent
            volumeMounts:
            - name: home
              mountPath: /home/omnigent
  helpers:
  - id: claude-login
    title: Sign in to Claude
    icon: claude
    script: exec claude auth login
  - id: claude-start
    title: Open Claude
    icon: terminal
    script: exec claude
  ui:
    resources:
      default:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 20Gi
      minimum:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 100m
          memory: 256Mi
        storage: 1Gi
      maximum:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 50Gi
