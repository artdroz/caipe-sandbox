# Shared-cluster development using ordinary Pods and the portal's SQLite database.
# Supply the portal image, OIDC settings and auth Secret in an installation overlay.
agentSandbox:
  enabled: true
settings:
  namespacePrefix: dev  # Choose a unique prefix for each installation.
  runtimeClass: ""
  allowedRuntimeClasses: [""]
auth:
  existingSecret: portal-oidc
defaultProfile: development
profiles:
- id: development
  title: Development (containers)
  description: A persistent shell using the cluster's default container runtime.
  agentSandbox:
    spec:
      podTemplate:
        spec:
          containers:
          - name: host
            image: python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2  # Python 3.12
            command: [sleep, infinity]
            workingDir: /home/sandbox
            env:
            - name: HOME
              value: /home/sandbox
            volumeMounts:
            - name: home
              mountPath: /home/sandbox
  terminal:
    command: [/bin/sh, -i]
  helpers: []
