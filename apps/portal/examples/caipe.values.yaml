settings:
  runtimeClass: kata-qemu  # Replace with an installed, approved class.
# Set approved images and consumer URLs before deployment.
profiles:
- id: engineering
  title: Engineering terminal
  description: A persistent workspace with profile-defined tools and helpers.
  agentSandbox:
    spec:
      podTemplate:
        spec:
          containers:
          - name: host
            image: python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
            command:
            - sleep
            - infinity
            workingDir: /home/sandbox
            env:
            - name: HOME
              value: /home/sandbox
            volumeMounts:
            - name: home
              mountPath: /home/sandbox
  terminal:
    command:
    - /bin/sh
    - -i
  helpers:
  - id: workspace
    title: Open workspace
    icon: folder
    script: |
      cd "$HOME"
      exec /bin/sh -i
  - id: disk-usage
    title: Workspace disk usage
    icon: disk
    script: |
      du -sh "$HOME"
  ui:
    resources:
      default:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 20Gi
      minimum:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 100m
          memory: 256Mi
        storage: 1Gi
      maximum:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 50Gi
- id: caipe
  title: CAIPE workspace
  description: Replace the sample image with an approved image containing the CAIPE CLI.
  agentSandbox:
    spec:
      podTemplate:
        spec:
          containers:
          - name: host
            image: example.invalid/agent-tools:caipe
            command:
            - sleep
            - infinity
            workingDir: /home/sandbox
            env:
            - name: HOME
              value: /home/sandbox
            - name: CAIPE_SERVER_URL
              value: https://caipe.example.com
            - name: CAIPE_AUTH_URL
              value: https://caipe.example.com
            volumeMounts:
            - name: home
              mountPath: /home/sandbox
  terminal:
    command:
    - /bin/sh
    - -i
  helpers:
  - id: caipe-login
    title: Sign in to CAIPE
    icon: caipe
    script: |
      exec caipe auth login --device
    status:
      command:
      - caipe
      - auth
      - status
      - --json
      json_field: authenticated
  - id: workspace
    title: Open workspace
    icon: folder
    script: |
      cd "$HOME"
      exec /bin/sh -i
  ui:
    resources:
      default:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 20Gi
      minimum:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 100m
          memory: 256Mi
        storage: 1Gi
      maximum:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
        storage: 50Gi
defaultProfile: caipe
