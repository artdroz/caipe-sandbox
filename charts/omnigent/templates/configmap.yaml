{{- range $key := list "PORT" "DATABASE_URL" "OMNIGENT_ACCOUNTS_COOKIE_SECRET" "OMNIGENT_OIDC_CLIENT_SECRET" "OMNIGENT_OIDC_COOKIE_SECRET" }}
{{- if hasKey $.Values.config $key }}
{{- fail (printf "config.%s is reserved or secret; set the port with server.port and secrets through existingSecret" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnigent.fullname" . }}-config
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.server.port | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
