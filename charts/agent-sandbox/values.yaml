controller:
  image: registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.5
  extraArgs:
  - --zap-devel=false
  - --zap-encoder=json
  - --zap-log-level=info
  - --zap-time-encoding=rfc3339
  - --disable-sandbox-events=false
  # Native Kubernetes EnvVar entries; use valueFrom for collector credentials.
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
